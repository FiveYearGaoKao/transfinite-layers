name: Deploy to GitHub Pages

#两条发布线(约定见 docs/面向开发者/开发规范.md §三):
#  main = 正式版 → /<repo>/          beta = 测试版 → /<repo>/beta/
#Pages只能整站部署:两个路径必须在同一个artifact里,所以无论推哪条分支都构建两条(用显式ref,
#手动触发也不会把测试版代码发到正式路径),否则单独部署一条会把另一条删掉。
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release
        run: npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist
          retention-days: 1

  build-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build beta
        run: npm run build:beta

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta
          path: dist/beta
          retention-days: 1

  deploy:
    needs: [build-release, build-beta]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      #正式版在站点根、测试版在子目录beta/(与vite.config.ts里beta的base一致)
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: site

      - name: Download beta artifact
        uses: actions/download-artifact@v4
        with:
          name: beta
          path: site/beta

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
